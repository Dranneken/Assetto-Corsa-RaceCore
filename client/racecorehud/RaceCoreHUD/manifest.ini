[ABOUT]
NAME = RaceCore HUD
AUTHOR = RaceCore, based on C1XTZ
VERSION = 1.29
DESCRIPTION = RaceCore multi-panel driver HUD based on RennsportHUD 1.29
URL = https://github.com/Dranneken/Assetto-Corsa-RaceCore
REQUIRED_VERSION = 2651

[CORE]
LAZY = 1

[WINDOW_...]
ID = main
NAME = RaceCore HUD Settings
ICON = icons/settings.png
FUNCTION_MAIN = windowMain
FLAGS = MAIN, AUTO_RESIZE, NO_COLLAPSE, NO_SCROLL_WITH_MOUSE, NO_SCROLLBAR, EXTRAS

[WINDOW_...]
PADDING = 0,0
ID = essentials
NAME = RaceCore HUD Essentials
ICON = icons/essentials.png
FUNCTION_MAIN = essentials
FLAGS = AUTO_RESIZE, NO_BACKGROUND, FADING, NO_COLLAPSE, NO_SCROLL_WITH_MOUSE, NO_SCROLLBAR, EXTRAS, FLOATING_TITLE_BAR

